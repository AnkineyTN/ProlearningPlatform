name: DEPLOY_DEV
on:
  workflow_run:
    workflows:
      - "BUILD IMAGE"
    types:
      - "completed"
  workflow_dispatch:

env:
  REGISTRY: ${{ secrets.REGISTRY }}
  IMAGE_NAME: ${{ secrets.IMAGE_NAME }}

permissions:
  actions: read
  contents: read
  checks: read
  pull-requests: read

jobs:
  deploy_dev:
    # needs: integration_tests
    runs-on: ubuntu-latest
    environment: Development
    if: |
      ${{ 
        github.event.workflow_run.conclusion == 'success' && 
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'dev'
      }}

    steps:
      - name: Download SHA Artifact
        uses: actions/github-script@v7
        with:
          script: |
            const runId = context.payload.workflow_run.id;
            console.log(`--- Run ID being used: ${runId}`);
            
            var allArtifacts = await github.rest.actions.listWorkflowRunArtifacts({
               owner: context.repo.owner,
               repo: context.repo.repo,
               run_id: context.payload.workflow_run.id,
            });
            
            console.log('--- List of all artifacts found:');
            console.log(allArtifacts.artifacts.map(a => a.name));
            
            var matchArtifact = allArtifacts.artifacts.filter((artifact) => {
              return artifact.name == "image-sha-artifact"
            })[0];
            var download = await github.rest.actions.downloadArtifact({
               owner: context.repo.owner,
               repo: context.repo.repo,
               artifact_id: matchArtifact.id,
               archive_format: 'zip',
            });
            var fs = require('fs');
            fs.writeFileSync('${{ github.workspace }}/sha.zip', Buffer.from(download.data));
      
      - name: Unzip Artifact
        run: unzip sha.zip
        
      - name: Read SHA
        id: read_sha
        run: echo "IMAGE_SHA=$(cat image_sha.txt)" >> $GITHUB_OUTPUT

      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Tag and Push Dev Image
        run: |
          IMAGE_SHA=${{ steps.read_sha.outputs.IMAGE_SHA }}
          echo "Pulling image with SHA: $IMAGE_SHA"
          # Pull image CHÍNH XÁC từ SHA đã được truyền qua artifact
          docker pull ${{ secrets.REGISTRY_USERNAME }}/${{ env.IMAGE_NAME }}:$IMAGE_SHA
          docker tag ${{ secrets.REGISTRY_USERNAME }}/${{ env.IMAGE_NAME }}:$IMAGE_SHA ${{ secrets.REGISTRY_USERNAME }}/${{ env.IMAGE_NAME }}:dev
          docker push ${{ secrets.REGISTRY_USERNAME }}/${{ env.IMAGE_NAME }}:dev

      - name: Deploy to Dev Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login ${{ env.REGISTRY }} -u ${{ secrets.REGISTRY_USERNAME }} --password-stdin

            cd ${{ vars.PATH_TO_PROJECT }}

            docker compose down
            docker pull ${{ secrets.REGISTRY_USERNAME }}/${{ env.IMAGE_NAME }}:dev
            docker compose --env-file .env.dev up -d
