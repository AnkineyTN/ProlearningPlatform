server:
  port: ${SERVER_PORT:8080}

spring:
  profiles:
    active: ${PROFILE:dev}

  application:
    name: Prolearning Platform

  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
#    show-sql: true

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  security:
    jwt:
      secret: fee55fe254d24a95863994171c5e5404AKN0108cigquahfdja
      access-ttl-ms: 900000
      refresh-ttl-ms: 604800000
    refresh-cookie:
      name: refresh_token
      secure: false
      http-only: true
      path: /auth
      same-site: Strict

springdoc:
  swagger-ui:
    path: api-docs

logging:
  level:
    root: DEBUG
    com.cabybara.prolearningplatform.service: DEBUG
    org.springframework.security: TRACE

---
spring:
  profiles: prod

logging:
  level:
    root: INFO
