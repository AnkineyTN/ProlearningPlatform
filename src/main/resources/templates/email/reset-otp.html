<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
    <head>
        <meta charset="UTF-8" />
        <style>
            body {
                margin: 0;
                padding: 0;
                background: #f5f5f5;
                font-family: Arial, sans-serif;
            }
            .wrap {
                max-width: 480px;
                margin: 40px auto;
                background: #ffffff;
                border: 1px solid #e5e5e5;
            }
            .header {
                padding: 24px;
                text-align: center;
                border-bottom: 1px solid #e5e5e5;
            }
            .header img {
                width: 40px;
                margin-bottom: 10px;
            }
            .header h1 {
                margin: 0;
                font-size: 18px;
                color: #111;
            }
            .body {
                padding: 28px;
                font-size: 14px;
                color: #333;
                line-height: 1.6;
            }
            .otp {
                font-size: 36px;
                font-weight: bold;
                letter-spacing: 8px;
                text-align: center;
                margin: 24px 0;
                padding: 16px;
                border: 1px dashed #ccc;
            }
            .warning {
                font-size: 13px;
                color: #555;
                margin-top: 16px;
                padding: 12px;
                border-left: 3px solid #000;
                background: #fafafa;
            }
            .footer {
                padding: 16px;
                font-size: 12px;
                text-align: center;
                color: #999;
                border-top: 1px solid #e5e5e5;
            }
        </style>
    </head>
    <body>
        <div class="wrap">
            <div class="header">
                <img
                    src="https://res.cloudinary.com/di7fmdhw6/image/upload/v1775215608/ios-light_dvxoek.png"
                />
                <h1>Password Reset</h1>
            </div>

            <div class="body">
                <p>Hello <strong th:text="${username}"></strong>,</p>

                <p>Your password reset code is:</p>

                <div class="otp" th:text="${otp}">000000</div>

                <div class="warning">
                    This code will expire in
                    <strong th:text="${expiryMinutes}"></strong> minutes. If you did not request
                    this, please ignore this email.
                </div>
            </div>

            <div class="footer">
                © 2025 ProLearning · This is an automated email, please do not reply.
            </div>
        </div>
    </body>
</html>
