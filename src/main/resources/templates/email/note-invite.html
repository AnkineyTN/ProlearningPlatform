<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
    <head>
        <meta charset="UTF-8" />
        <style>
            body {
                margin: 0;
                padding: 0;
                background: #f5f5f5;
                font-family: Arial, sans-serif;
            }
            .wrap {
                max-width: 480px;
                margin: 40px auto;
                background: #fff;
                border: 1px solid #e5e5e5;
            }
            .header {
                padding: 24px;
                text-align: center;
                border-bottom: 1px solid #e5e5e5;
            }
            .header img {
                width: 40px;
                margin-bottom: 10px;
            }
            .header h1 {
                margin: 0;
                font-size: 18px;
                color: #111;
            }
            .body {
                padding: 28px;
                font-size: 14px;
                color: #333;
                line-height: 1.6;
            }
            .info {
                margin: 16px 0;
                padding: 12px;
                background: #fafafa;
                border-left: 3px solid #000;
                font-size: 13px;
            }
            .btn {
                display: inline-block;
                margin: 20px 0;
                padding: 12px 28px;
                background: #111;
                color: #fff;
                text-decoration: none;
                font-size: 14px;
            }
            .btn {
                display: inline-block;
                margin: 20px 0;
                padding: 12px 28px;
                background: #111;

                color: #ffffff !important;
                text-decoration: none !important;

                font-size: 14px;
                font-weight: 600;
                border-radius: 6px;

                font-family: Arial, sans-serif;
            }
            .btn:visited {
                color: #ffffff !important;
            }

            .btn:hover {
                background: #333 !important;
                color: #ffffff !important;
            }
            .warning {
                margin-top: 16px;
                padding: 12px;
                font-size: 13px;
                background: #fafafa;
                border-left: 3px solid #000;
            }
            .footer {
                padding: 16px;
                font-size: 12px;
                text-align: center;
                color: #999;
                border-top: 1px solid #e5e5e5;
            }
        </style>
    </head>
    <body>
        <div class="wrap">
            <div class="header">
                <img
                    src="https://res.cloudinary.com/di7fmdhw6/image/upload/v1775215608/ios-light_dvxoek.png"
                />
                <h1>Collaboration Invite</h1>
            </div>
            <div class="body">
                <p>Hello,</p>
                <p>
                    <strong th:text="${inviterName}"></strong>
                    has invited you to collaborate on a note.
                </p>
                <div class="info">
                    <div>Note: <strong th:text="${noteTitle}"></strong></div>
                    <div style="margin-top: 6px">Role: <strong th:text="${role}"></strong></div>
                </div>
                <a
                    th:href="${acceptUrl}"
                    class="btn"
                    style="
                        display: inline-block;
                        padding: 12px 28px;
                        background: #111;
                        color: #ffffff;
                        text-decoration: none;
                        font-weight: 600;
                        border-radius: 6px;
                        font-family: Arial, sans-serif;
                    "
                    >Accept Invitation</a
                >
                <div class="warning">
                    This link expires in
                    <strong th:text="${expiryHours} + ' hours'"></strong>. If you didn't expect this
                    invitation, you can safely ignore this email.
                </div>
            </div>
            <div class="footer">
                © 2025 ProLearning · This is an automated email, please do not reply.
            </div>
        </div>
    </body>
</html>
