<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
    <head>
        <meta charset="UTF-8" />
        <style>
            body {
                margin: 0;
                padding: 0;
                background: #f5f5f5;
                font-family: Arial, sans-serif;
            }
            .wrap {
                max-width: 480px;
                margin: 40px auto;
                background: #ffffff;
                border: 1px solid #e5e5e5;
            }
            .header {
                padding: 24px;
                text-align: center;
                border-bottom: 1px solid #e5e5e5;
            }
            .header img {
                width: 40px;
                margin-bottom: 10px;
            }
            .header h1 {
                margin: 0;
                font-size: 18px;
                color: #111;
            }
            .body {
                padding: 28px;
                font-size: 14px;
                color: #333;
                line-height: 1.6;
            }
            .info {
                margin: 16px 0;
                padding: 12px;
                background: #fafafa;
                border-left: 3px solid #000;
                font-size: 13px;
            }
            .warning {
                margin-top: 16px;
                padding: 12px;
                font-size: 13px;
                background: #fafafa;
                border-left: 3px solid #000;
            }
            .footer {
                padding: 16px;
                font-size: 12px;
                text-align: center;
                color: #999;
                border-top: 1px solid #e5e5e5;
            }
        </style>
    </head>
    <body>
        <div class="wrap">
            <div class="header">
                <img
                    src="https://res.cloudinary.com/di7fmdhw6/image/upload/v1775215608/ios-light_dvxoek.png"
                />
                <h1>Password Changed</h1>
            </div>

            <div class="body">
                <p>Hello <strong th:text="${username}"></strong>,</p>

                <p>Your account password has been successfully changed.</p>

                <div class="info">Time: <strong th:text="${changedAt}"></strong></div>

                <div class="warning">
                    If you did not perform this action, please contact us immediately:
                    <br />
                    <a th:href="'mailto:' + ${supportEmail}" th:text="${supportEmail}"></a>
                </div>
            </div>

            <div class="footer">
                © 2025 ProLearning · This is an automated email, please do not reply.
            </div>
        </div>
    </body>
</html>
